name: autoscore
channels:
  - conda-forge
  - pytorch
dependencies:
  - python=3.10
  - numpy=1.26
  - pandas>=2.1
  - matplotlib>=3.8
  - scipy>=1.11
  - mne>=1.7
  - scikit-learn>=1.3
  - seaborn>=0.13
  - h5py>=3.10
  - joblib>=1.3
  - ipykernel
  - ipywidgets>=8.1
  - pip
  - pytorch::pytorch>=2.0,<2.6
  - pip:
      - yasa>=0.7
      - gssc>=0.0.9
      - voila>=0.5
      - ipyfilechooser>=0.6
