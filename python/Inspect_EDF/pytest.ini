[pytest]
testpaths = tests
addopts = -p no:cacheprovider --strict-markers
filterwarnings =
    ignore::RuntimeWarning:zmq.*
    ignore:Cell is missing an id field
# Levels (see TESTS.md): quick = -m quick, standard = -m "not full", full = everything.
# Tool markers select the tests of some tools: -m "tool7 or tool8 or tool8bis or tool9".
markers =
    quick: fast checks (unit tests, every notebook executes), ~2 min
    full: slow checks (real dataset, parameter variants), excluded from the standard level
    tool5: tests of tool 5 (sleep macrostructure)
    tool5bis: tests of tool 5bis (participant selection)
    tool6: tests of tool 6 (quality overview)
    tool7: tests of tool 7 (preprocessing + flagging)
    tool8: tests of tool 8 (manual rejection)
    tool8bis: tests of tool 8bis (automatic rejection)
    tool9: tests of tool 9 (spectral features)
