name: inspect_edf
channels:
  - conda-forge
dependencies:
  - python=3.12.10
  - spyder=6.0.*
  - numpy=2.2.*
  - pandas=2.2.*
  - mne=1.12.*
  - yasa=0.6.*
  - voila=0.5.*
  - notebook=7.4.*
  - chardet=5.2.*
  - ipyfilechooser=0.6.*
  - ipython=8.36.*
  - ipywidgets=8.1.*
  - ipyevents=2.0.*
  - ipykernel=6.29.*
  - tk=8.6.*
  - scipy=1.16.*
  - matplotlib=3.10.*
  - statsmodels=0.14.*
  - scikit-learn=1.7.*
  - joblib=1.5.*
  - edfio=0.4.*
  - openpyxl=3.1.*
  - pytest            # tests/ (headless notebook pipeline tests); nbclient comes with voila
  - pytorch-cpu       # tool 3bis (GSSC automatic sleep scoring)
  - h5py=3.14.*       # tool 3bis: SleepFM's input file (also brought by mne; explicit for the light / full split)
  - einops=0.8.*      # tool 3bis: SleepFM (imported by its official code)
  - loguru=0.7.*      # tool 3bis: SleepFM (imported by its official code)
  - pyyaml=6.0.*      # tool 3bis: SleepFM (imported by its official code)
  - pip
  - pip:
    - specparam
    - curryreader
    - gssc==0.0.9     # tool 3bis: pip-only; pinned because tool 3bis reproduces its scoring loop